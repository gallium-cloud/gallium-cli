[workspace]

members = [
    "libs/qemu_img_cmd_types"
]

[package]
name = "gallium-cli"
version = "0.2.0-pre7"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["cargo", "derive"] }
cliclack = "0.5"
chrono = "0.4"
derive_more = { version = "2", features = ["constructor"] }
dialoguer = { version = "0.12" }
directories = "6.0.0"
dlmgr = "0.4"
duct = { version = "1" }
fs2 = "0.4.3"
futures-util = { version = "0.3" }
hex-literal = "1.1.0"
home = { version = "0.5.12" }
humansize = "2"
pem = "4"
qemu_img_cmd_types = { path = "libs/qemu_img_cmd_types" }
rcgen = { version = "0.14", features = ["crypto","ring", "x509-parser"] }
reqwest = { version = "0.13", features = ["json", "query", "rustls"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
snafu = { version = "0.9", features = ["rust_1_81"] }
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "io-std", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots", "stream", "connect"], default-features = false }
unicode-ellipsis = "0.6"
unicode-segmentation = "1.13"
url = { version = "2" }
which = "8"
x509-parser = "0.18.1"


[build-dependencies]
time = "0.3"

[lints.clippy]

# Enable desired off-by-default lints
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

