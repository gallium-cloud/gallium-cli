[workspace]

members = [
    "libs/gallium_api_client",
    "libs/qemu_img_cmd_types",
]

[package]
name = "gallium-cli"
version = "0.3.0-pre.2"
edition = "2024"
repository = "https://github.com/gallium-cloud/gallium-cli"
authors = ["Gallium Cloud Inc."]
description = "CLI tool for managing Gallium Cloud resources"

[package.metadata.wix]
upgrade-guid = "345D055E-D176-4AC6-AACD-B494BDC048BC"
path-guid = "D36ECD81-D5CD-4F9F-B240-2AEA52A3053F"
license = false
eula = false

[[bin]]
name = "ga"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1"
base64 = "0.23"
clap = { version = "4.6", features = ["cargo", "derive"] }
cliclack = "0.5"
chrono = "0.4"
comfy-table = { version = "8", default-features = false }
derive_more = { version = "2", features = ["constructor"] }
dialoguer = { version = "0.12" }
directories = "6.0.0"
dlmgr = "0.4"
duct = { version = "1" }
fs2 = "0.4.3"
gethostname = "1"
futures-util = { version = "0.3" }
gallium_api_client = { path = "libs/gallium_api_client" }
hex-literal = "1.1.0"
home = { version = "0.5.12" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
humansize = "2"
indicatif = "0.18"
jwt-compact = { version = "0.8.0" }
oauth2 = { version = "5", default-features = false }
open = "5"
pem = "4"
qemu_img_cmd_types = { path = "libs/qemu_img_cmd_types" }
rcgen = { version = "0.14", features = ["crypto","ring", "x509-parser"] }
reqwest = { version = "0.13", features = ["json", "query", "rustls"] }
reqwest-middleware = "0.5"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
snafu = { version = "0.9", features = ["rust_1_81"] }
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "fs", "sync", "net", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots", "stream", "connect"], default-features = false }
unicode-ellipsis = "0.6"
unicode-segmentation = "1.13"
url = { version = "2" }
which = "8"
x509-parser = "0.18.1"
yaml-rust2 = { version = "0.13", default-features = false }
annotate-snippets = "0.12"


[build-dependencies]
time = "0.3"

[lints.clippy]

# Enable desired off-by-default lints
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

# temporarily allow until derive_more is patched for rust 1.100
redundant_field_names = "allow"

[profile.release]
lto = "thin"

[profile.dist]
inherits = "release"
lto = "thin"
